name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the compilers, Vulkan loader and shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang gcc libvulkan-dev make shellcheck
      - name: Build with -Werror and run the tests that need no GPU
        run: make check
